<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジャグラー ボーダー判定</title>
<style>
  :root{
    --bg:#16141a;
    --panel:#211d26;
    --panel-line:#332e3b;
    --text:#f1ede7;
    --text-dim:#948d9c;
    --gold:#c99a3f;
    --gold-dim:#3a3226;
    --teal:#4f8c8a;
    --teal-dim:#233533;
    --clear:#6fa96c;
    --clear-bg:#1c2a1c;
    --short:#c1544a;
    --short-bg:#2a1c1b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .wrap{width:100%;max-width:480px;}

  header{margin-bottom:22px;}
  .eyebrow{
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:.02em;
    margin:0 0 4px;
  }
  h1{
    font-size:26px;
    font-weight:700;
    letter-spacing:-.01em;
    margin:0;
    line-height:1.25;
  }
  h1 span{font-weight:400;color:var(--text-dim);}

  .machine-toggle{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:22px 0 18px;
  }
  .machine-btn{
    border:1px solid var(--panel-line);
    background:var(--panel);
    color:var(--text-dim);
    border-radius:10px;
    padding:14px 10px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
    text-align:left;
    line-height:1.3;
  }
  .machine-btn small{display:block;font-weight:400;font-size:12px;margin-top:2px;color:var(--text-dim);}
  .machine-btn.active[data-m="myjug5"]{
    border-color:var(--gold); color:var(--gold); background:var(--gold-dim);
  }
  .machine-btn.active[data-m="aimjug"]{
    border-color:var(--teal); color:var(--teal); background:var(--teal-dim);
  }

  .card{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:20px;
    margin-bottom:14px;
  }

  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  label{
    display:block;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  input[type="number"]{
    width:100%;
    background:#171319;
    border:1px solid var(--panel-line);
    border-radius:8px;
    color:var(--text);
    font-size:22px;
    font-variant-numeric:tabular-nums;
    padding:10px 12px;
    font-weight:600;
  }
  input[type="number"]:focus{
    outline:none;
    border-color:var(--text-dim);
  }
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  .result{
    border-radius:14px;
    padding:22px 20px;
    margin-bottom:14px;
    border:1px solid var(--panel-line);
  }
  .result.clear{background:var(--clear-bg);border-color:var(--clear);}
  .result.short{background:var(--short-bg);border-color:var(--short);}
  .result.empty{background:var(--panel);color:var(--text-dim);text-align:center;padding:30px 20px;}

  .result-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .result-label{font-size:13px;color:var(--text-dim);}
  .result-status{font-size:16px;font-weight:700;}
  .result.clear .result-status{color:var(--clear);}
  .result.short .result-status{color:var(--short);}

  .rate-row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
  .rate-num{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;}
  .rate-vs{font-size:14px;color:var(--text-dim);}

  .bar-track{
    height:8px;
    background:#171319;
    border-radius:4px;
    margin:16px 0 12px;
    overflow:hidden;
  }
  .bar-fill{height:100%;border-radius:4px;transition:width .25s ease;}
  .result.clear .bar-fill{background:var(--clear);}
  .result.short .bar-fill{background:var(--short);}

  .detail-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--text-dim);
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,.06);
  }
  .detail-row strong{color:var(--text);font-weight:600;}

  table.ref{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  table.ref caption{
    text-align:left;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:10px;
    caption-side:top;
  }
  table.ref th,table.ref td{
    padding:8px 6px;
    text-align:right;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-variant-numeric:tabular-nums;
  }
  table.ref th:first-child,table.ref td:first-child{text-align:left;}
  table.ref th{color:var(--text-dim);font-weight:500;}

  footer{
    margin-top:6px;
    font-size:12px;
    color:var(--text-dim);
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">JUGGLER BORDER CHECK</p>
    <h1>ジャグラー<br><span>実戦ボーダー判定</span></h1>
  </header>

  <div class="machine-toggle">
    <button class="machine-btn active" data-m="myjug5" onclick="setMachine('myjug5')">
      マイジャグラー5
      <small>3000G:1/250 ・4000G:1/250 ・5000G:1/263</small>
    </button>
    <button class="machine-btn" data-m="aimjug" onclick="setMachine('aimjug')">
      アイムジャグラー
      <small>3000G:1/250 ・4000G:1/267 ・5000G:1/263</small>
    </button>
  </div>

  <div class="card">
    <div class="field">
      <label for="gcount">現在の遊技G数</label>
      <input type="number" id="gcount" inputmode="numeric" placeholder="例: 4200" oninput="update()">
    </div>
    <div class="field">
      <label for="hits">REG回数（レギュラーの合計）</label>
      <input type="number" id="hits" inputmode="numeric" placeholder="例: 15" oninput="update()">
    </div>
  </div>

  <div class="result empty" id="result">
    G数とREG回数を入力すると判定します
  </div>

  <div class="card">
    <table class="ref">
      <caption>設定した機種のボーダー基準値（REG回数）</caption>
      <thead>
        <tr><th>G数</th><th>必要回数</th><th>確率</th></tr>
      </thead>
      <tbody id="refTable"></tbody>
    </table>
  </div>

  <footer>
    ボーダーは「3000G・4000G・5000G」の3点をもとに、区間ごとの傾きで比例計算しています。5000Gを超える区間は5000G時点の傾きをそのまま延長した参考値です。指定区間の外側は目安としてご覧ください。判定対象はREG回数（BIGは含みません）です。
  </footer>

</div>

<script>
  const BORDERS = {
    myjug5: {
      name: "マイジャグラー5",
      points: [[3000,12],[4000,16],[5000,19]]
    },
    aimjug: {
      name: "アイムジャグラー",
      points: [[3000,12],[4000,15],[5000,19]]
    }
  };

  let currentMachine = "myjug5";

  function setMachine(m){
    currentMachine = m;
    document.querySelectorAll(".machine-btn").forEach(b=>{
      b.classList.toggle("active", b.dataset.m === m);
    });
    renderRefTable();
    update();
  }

  // 区間ごとの線形補間・外挿で「必要回数」を求める
  function requiredHits(g, points){
    if (g <= 0) return 0;
    if (g <= points[0][0]){
      const [g0,h0] = points[0];
      return h0 * (g / g0);
    }
    for (let i=0; i<points.length-1; i++){
      const [g0,h0] = points[i];
      const [g1,h1] = points[i+1];
      if (g >= g0 && g <= g1){
        const ratio = (g - g0) / (g1 - g0);
        return h0 + (h1 - h0) * ratio;
      }
    }
    // g が最終区間より大きい場合、最終区間の傾きで延長
    const [gA,hA] = points[points.length-2];
    const [gB,hB] = points[points.length-1];
    const slope = (hB - hA) / (gB - gA);
    return hB + slope * (g - gB);
  }

  function renderRefTable(){
    const data = BORDERS[currentMachine];
    const rows = data.points.map(([g,h])=>{
      const rate = g / h;
      return `<tr><td>${g.toLocaleString()}G</td><td>${h}回以上</td><td>1/${rate.toFixed(0)}</td></tr>`;
    }).join("");
    document.getElementById("refTable").innerHTML = rows;
  }

  function update(){
    const g = parseFloat(document.getElementById("gcount").value);
    const hits = parseFloat(document.getElementById("hits").value);
    const resultEl = document.getElementById("result");

    if (!g || g<=0 || isNaN(hits)){
      resultEl.className = "result empty";
      resultEl.innerHTML = "G数とREG回数を入力すると判定します";
      return;
    }

    const data = BORDERS[currentMachine];
    const need = requiredHits(g, data.points);
    const needRounded = Math.ceil(need);
    const currentRate = g / hits;
    const isClear = hits >= need;
    const diff = hits - need;
    const progressPct = Math.min(100, Math.max(4, (hits/needRounded)*100));

    resultEl.className = "result " + (isClear ? "clear" : "short");
    resultEl.innerHTML = `
      <div class="result-top">
        <span class="result-label">${data.name} ・ ${g.toLocaleString()}G時点</span>
        <span class="result-status">${isClear ? "ボーダー通過" : "ボーダー未達"}</span>
      </div>
      <div class="rate-row">
        <span class="rate-num">1/${currentRate.toFixed(0)}</span>
        <span class="rate-vs">実測（REG${hits}回）</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${progressPct}%"></div></div>
      <div class="detail-row">
        <span>このG数のボーダー</span>
        <strong>${needRounded}回以上（1/${Math.round(g/needRounded)}）</strong>
      </div>
      <div class="detail-row">
        <span>${isClear ? "ボーダーを上回る回数" : "ボーダーまであと"}</span>
        <strong>${Math.abs(diff).toFixed(1)}回</strong>
      </div>
    `;
  }

  renderRefTable();
</script>
</body>
</html>
